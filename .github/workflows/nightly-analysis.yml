name: Nightly Analysis Catch-up

# 매일 아침 리포트(오전 8시 마감) 전까지 분류->신뢰도->중요도->랭킹을 최대한
# 끝내기 위한 전담 배치. scheduled-data-refresh.yml(30분 주기)은 백로그가 크면
# collect+preprocess만으로 시간 대부분을 쓰고 분석 뒷단계(중요도·랭킹)가
# 시작도 못 하는 경우가 잦았다 (2026-08-07 조사, run 31135258583 — 분류 끝나고
# 신뢰도 도중 55분 타임아웃). 그 결과 당일 발행 기사가 리포트 후보(중요도·
# 신뢰도 둘 다 40점 이상)에 하나도 못 들어 리포트가 빈 채로 "완료"됐다.

# KST 00:00(=UTC 전날 15:00)에 시작해서, GitHub Actions 호스팅 러너의 job
# 최대 실행 시간(6시간)에 맞춰 도는 만큼 돈다. scripts/run_nightly_analysis.py가
# 오늘(KST) 발행분부터 우선 끝내고 남은 시간에 백로그를 처리한다.
#
# 이 창(KST 00:00~06:00) 동안은 scheduled-data-refresh.yml 쪽에서 분석 단계를
# 건너뛴다 (refresh_data_scheduled.py의 is_within_nightly_analysis_window) —
# 같은 문서를 두 프로세스가 동시에 분석해 LLM 호출을 낭비하지 않도록.

on:
  schedule:
    - cron: "0 15 * * *" # UTC 15:00 = KST 00:00
  workflow_dispatch: {}

concurrency:
  group: nightly-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # GitHub 호스팅 러너의 job 실행 시간은 플랫폼이 6시간(360분)으로 강제 상한을
    # 두고 있어 이보다 크게 잡아도 의미가 없다. 스크립트 내부 예산(기본 350분)이
    # 이보다 먼저 끝나 스스로 정리하고 종료하므로, 여기 355분은 안전 마진이다.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly analysis (분류 -> 신뢰도 -> 중요도 -> 랭킹, 오늘자 우선)
        run: python scripts/run_nightly_analysis.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
