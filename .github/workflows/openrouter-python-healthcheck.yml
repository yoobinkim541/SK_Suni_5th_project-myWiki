name: OpenRouter Python Healthcheck

on:
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenAI client
        run: pip install "openai>=1.99"
      - name: Probe OpenAI-compatible client
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from openai import OpenAI

          client = OpenAI(
              base_url="https://openrouter.ai/api/v1",
              api_key=os.environ["OPENROUTER_API_KEY"],
              max_retries=1,
          )
          response = client.chat.completions.create(
              model="deepseek/deepseek-v4-flash-0731",
              temperature=0,
              messages=[
                  {"role": "system", "content": "Return only a JSON object."},
                  {"role": "user", "content": "Return {\"ok\":true}."},
              ],
              response_format={"type": "json_object"},
              timeout=30,
          )
          print({"model": response.model, "choices": len(response.choices), "content": response.choices[0].message.content})
          PY
