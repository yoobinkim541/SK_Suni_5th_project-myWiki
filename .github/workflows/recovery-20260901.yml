name: Recovery Daily Report and Wiki

on:
  push:
    branches: [develop]
    paths:
      - ".github/workflows/recovery-20260901.yml"

# Recovery is intentionally serial: the wiki refresh consumes the report sections
# produced by the preceding command in the same Hermes container.
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Generate report and refresh wiki on Hermes
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" '
            set -e
            cd ~/projects/myWiki
            docker compose exec -T api python scripts/generate_daily_report_scheduled.py
            docker compose exec -T api python scripts/refresh_wiki_scheduled.py
          '
