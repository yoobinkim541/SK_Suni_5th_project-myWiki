name: Report Composer Regression Test

on:
  push:
    branches: [develop]
    paths:
      - "tests/test_report_composer.py"
      - ".github/workflows/report-composer-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run report composer regression test
        run: PYTHONPATH=. pytest -q tests/test_report_composer.py
