name: Scheduled Analysis

# scheduled-collection.yml(수집·정제)과 짝을 이루는 배치 — 분류/신뢰도/중요도/랭킹
# 4단계를 순서대로 돈다. 이 워크플로우가 없어서 그동안 수집만 계속 쌓이고 분석은
# 멈춰 있었다(위키/리포트 후보가 0건으로 나오던 원인 중 하나 — 2026-08-04 발견).

on:
  schedule:
    - cron: "47 */2 * * *" # 2시간마다, scheduled-collection(:17) 30분 뒤(수집 끝난 걸 분석)
  workflow_dispatch: {} # 수동 트리거(디버깅·최초 검증용)

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run classify -> reliability -> importance -> ranking
        run: python scripts/run_analysis_pipeline.py --limit 20
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
