name: Scheduled Collection

on:
  schedule:
    - cron: "17 */2 * * *" # 2시간마다, 정각 부하 피하려고 17분
  workflow_dispatch: {} # 수동 트리거(디버깅·최초 검증용)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure sources are registered
        run: python scripts/register_sources.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - name: Run collect + preprocess
        run: python scripts/run_pipeline.py --limit 5
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
