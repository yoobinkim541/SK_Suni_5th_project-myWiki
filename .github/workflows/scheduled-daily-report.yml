name: Scheduled Daily Report

# GitHub Actions cron is UTC. 23:00 UTC is 08:00 Korea Standard Time (UTC+9).
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-report-schedule
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily report
        run: python scripts/generate_daily_report_scheduled.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
