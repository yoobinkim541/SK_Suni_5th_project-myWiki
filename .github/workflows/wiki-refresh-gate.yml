name: Wiki Refresh Gate

# Wiki generation runs in the Hermes backend container so the stock-report-style
# Codex CLI fallback can use the VM's read-only ~/.codex mount.
on:
  schedule:
    - cron: "*/30 * * * *" # 30분마다 — 실제 갱신 여부는 스크립트 안에서 주기 설정을 보고 판단
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 백로그가 크면(예: 게이트가 여러 사이클 밀렸다 재개) 처리할 섹션이 많아져 30분으로도
    # 부족할 수 있다(2026-08-09 실측: since_hours=8일 때 30분 타임아웃에 걸려 중간에 취소됨).
    # 넉넉하게 늘려도 리포트(scheduled-daily-report.yml, KST 08:30 마감)와 안 겹치는 건
    # refresh_wiki_scheduled.py의 REPORT_CRITICAL_WINDOW_KST(06:00~08:30 스킵)가 보장한다.
    timeout-minutes: 90
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run wiki refresh gate on Hermes
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" '
            set -e
            cd ~/projects/myWiki
            docker compose exec -T api python scripts/refresh_wiki_scheduled.py
          '
