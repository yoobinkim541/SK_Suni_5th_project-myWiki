services:
  api:
    build: .
    image: mywiki-api:latest
    container_name: mywiki-api
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file:
      - .env
    # Optional ChatGPT-managed Codex login. Set CODEX_HOST_HOME on Hermes to
    # the host user's ~/.codex directory; the default empty directory keeps
    # normal OpenRouter-only deployments working.
    #
    # This must be read-write, not :ro — Codex CLI writes its own runtime
    # state (app-server socket/cache, PATH alias shims) under $CODEX_HOME at
    # every invocation, not just auth.json at login time. A read-only mount
    # made every call fail with "failed to initialize in-process app-server
    # client: Read-only file system" even though login/auth itself worked
    # (confirmed live, 2026-09-03).
    volumes:
      - ${CODEX_HOST_HOME:-./.codex}:/root/.codex

  # Run once on Hermes to create/update the ChatGPT-managed auth.json.
  codex-login:
    profiles: ["codex-login"]
    build: .
    image: mywiki-api:latest
    entrypoint: ["codex"]
    command: ["login"]
    stdin_open: true
    tty: true
    volumes:
      - ${CODEX_HOST_HOME:-./.codex}:/root/.codex
