services:
  api:
    build: .
    image: mywiki-api:latest
    container_name: mywiki-api
    restart: unless-stopped
    ports:
      - "8010:8000"
    env_file:
      - .env
    # Optional ChatGPT-managed Codex login. Set CODEX_HOST_HOME on Hermes to
    # the host user's ~/.codex directory; the default empty directory keeps
    # normal OpenRouter-only deployments working.
    volumes:
      - ${CODEX_HOST_HOME:-./.codex}:/root/.codex:ro

  # Run once on Hermes to create/update the ChatGPT-managed auth.json. This
  # profile is never started with the API and is the only RW auth mount.
  codex-login:
    profiles: ["codex-login"]
    build: .
    image: mywiki-api:latest
    entrypoint: ["codex"]
    command: ["login"]
    stdin_open: true
    tty: true
    volumes:
      - ${CODEX_HOST_HOME:-./.codex}:/root/.codex
