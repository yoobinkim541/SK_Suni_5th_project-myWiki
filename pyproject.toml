[project]
name = "sk-suni-mywiki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
    "openai>=1.99",
    "supabase>=2.9",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "python-dotenv>=1.0",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "googlenewsdecoder>=0.1.7",
    "pywebpush>=2.0",
]

[tool.vercel]
entrypoint = "src.api.main:app"
